# Override for the synthetic demo / quick end-to-end runs (no real data needed).
# Usage: python scripts/run.py all --override configs/synthetic.yaml
# Results go to a separate, git-ignored folder so they never mix with results/.
data:
  mode: synthetic
  root: data/raw/synthetic
  results_dir: data/results_synthetic
synthetic:
  n_patients: 300
  seed: 0
