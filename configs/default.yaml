# CertiVOI default configuration. All thresholds/hyperparameters live here, not in code.
# Implements docs/02_METHODOLOGY.md and docs/03_DATA_AND_COHORT.md.

project:
  name: certivoi
  seed: 42
  robustness_seeds: [42, 7, 2026]

data:
  mode: demo                 # demo | full | synthetic  (full => privacy rules in CONTRIBUTING.md §4)
  root: data/raw/mimic-iv-demo
  interim_dir: data/interim
  processed_dir: data/processed
  results_dir: results
  sample_frac: 1.0           # override with --sample-frac for smoke tests
  max_events_per_lab: 400000

compute:
  threads: 7                 # physical cores - 1
  max_ram_gb: 12

cohort:
  min_age: 18
  min_admission_hours: 24
  repeat_lookback_hours: 72
  min_gap_minutes: 1         # strictly-prior rule: data must be < t - min_gap

labs:
  # ref_range: fallback reference interval for label N when labevents ref_range_* is null
  HGB:   {itemid: 51222, unit: "g/dL",  plausible: [2.0, 25.0],  stability_delta: 0.5,  ref_range: [12.0, 17.5]}
  K:     {itemid: 50971, unit: "mEq/L", plausible: [1.0, 10.0],  stability_delta: 0.3,  ref_range: [3.3, 5.1]}
  CREAT: {itemid: 50912, unit: "mg/dL", plausible: [0.1, 25.0],  stability_delta: 0.2,  ref_range: [0.5, 1.2]}
  PLT:   {itemid: 51265, unit: "K/uL",  plausible: [1.0, 2000.0], stability_delta: 20.0, ref_range: [150.0, 440.0]}

feature_labs:              # cross-lab panel (verify with scripts/01_verify_items.py)
  HCT: 51221
  WBC: 51301
  NA: 50983
  CL: 50902
  HCO3: 50882
  BUN: 51006
  GLU: 50931
  CA: 50893
  MG: 50960
  PHOS: 50970
  INR: 51237

actions:                   # category boundaries (left-closed intervals); confirm with clinician
  HGB:   {boundaries: [7.0, 8.0],  names: [transfuse_consider, borderline, no_action]}
  K:     {boundaries: [3.5, 5.5],  names: [replete, no_action, treat_hyperK], at_boundary_upper: [true, false]}
  # at_boundary_upper[k]: does a value exactly equal to boundary k belong to the upper category?
  # Default true (left-closed). K: 5.5 is "no action" (02_METHODOLOGY §2: ">5.5 treat").
  PLT:   {boundaries: [10.0, 50.0], names: [prophylactic_transfuse, procedure_dependent, no_action]}
  CREAT:
    rule: kdigo
    abs_rise_48h: 0.3
    ratio_7d: [1.5, 2.0, 3.0]
    stage3_abs: 4.0
    names: [no_aki, aki_1, aki_2, aki_3]
  sensitivity_variants:    # used in E4 threshold sensitivity
    HGB: {boundaries: [7.0]}
    K:   {boundaries: [3.0, 6.0], at_boundary_upper: [true, false]}

verify:                    # expected d_labitems labels (case-insensitive substring) + fluid
  fluid: Blood
  expected_labels:
    51222: Hemoglobin
    50971: Potassium
    50912: Creatinine
    51265: Platelet Count
    51221: Hematocrit
    51301: White Blood Cells
    50983: Sodium
    50902: Chloride
    50882: Bicarbonate
    51006: Urea Nitrogen
    50931: Glucose
    50893: Calcium
    50960: Magnesium
    50970: Phosphate
    51237: INR

synthetic:                 # data.mode: synthetic -> generated into data.root if missing
  n_patients: 300
  seed: 0

splits:
  fractions: {train: 0.60, val: 0.10, calib: 0.15, test: 0.15}
  temporal:
    train_groups: ["2008 - 2010", "2011 - 2013", "2014 - 2016"]
    test_groups:  ["2017 - 2019"]
  crc_resamples: 100

model:
  quantiles: [0.02, 0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 0.95, 0.98]
  target: delta              # delta | absolute (ablation E6)
  lightgbm:
    n_estimators: 2000
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    early_stopping_rounds: 100
  small_grid:                # only grid allowed (CONTRIBUTING.md §3)
    num_leaves: [15, 31, 63]
    min_child_samples: [50, 200]
  calibration: isotonic
  use_grid: false            # true => pick small_grid by val pinball loss at tau=0.5 / val logloss
  creat_target: auto         # auto => CREAT fits delta and absolute, keeps lower val pinball (02 §3)

baselines:
  b1_max_hours: 24           # rule B1: last test < 24 h ago
  natural_threshold: 0.5     # E3 mode (a): classifier probability cut-off

conformal:
  alphas: [0.005, 0.01, 0.02, 0.05]
  ltt:
    betas: [0.02, 0.05]
    delta: 0.10
    grid_size: 100           # LTT lambda grid: 100 score quantiles from n_min to n flagged (02 §5.2)
  mondrian_groups: [sex, age_band, race_group, icu]
  age_bands: [18, 45, 65, 80, 200]

extensions:                # E7 certification extensions (02 §5.5–5.7)
  panels:                    # labs drawn in the same tube (one draw = one decision)
    CBC: [HGB, PLT]
    BMP: [K, CREAT]
  panel_scores: [max, noisy_or]
  online:
    alphas: [0.01, 0.05]
    eta: 0.002               # step size on the rank scale (fraction of tests flagged)
    audit_rates: [1.0, 0.2, 0.1]   # p: share of flagged tests still performed (1.0 = full-label reference)
    reps: 5
    window_frac: 0.2         # rolling window for worst-window miss rate (>= 100 tests)

triage:
  high_value_min_precision: 0.5

explain:
  shap_background_rows: 200
  shap_explain_rows: 5000
  faithfulness_k: [1, 3, 5]
  interval: [0.10, 0.90]

eval:
  bootstrap_reps: 1000
  ece_bins: 15
  min_cell_count: 10         # privacy: suppress aggregates with n < 10
  resample_calib_share: 0.5  # share of held-out (calib+test) patients used as calib in resamples
  temporal_recal_frac: 0.2   # E4: share of later-period patients used to re-calibrate CRC
  main_alpha: 0.01           # alpha used in single-number summaries (E6, Fig. 8)
